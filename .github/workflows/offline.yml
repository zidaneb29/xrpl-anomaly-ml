name: Offline verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Install locked service stack
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-service-py314.txt
      - name: Install locked plotting stack
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-phase2-plots-win-py314.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Import the service and server
        run: python -c "import xrpl_anomaly.service, uvicorn"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify local container with synthetic fixture
        if: runner.os == 'Linux'
        env:
          XRPL_TEST_IMAGE: xrpl-anomaly-ml:ci
        run: |
          docker version
          docker build --platform linux/amd64 -t "$XRPL_TEST_IMAGE" .
          python -m unittest discover -s tests -p test_phase4c.py -v
